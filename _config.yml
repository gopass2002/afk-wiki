title: 비룡 위키
tagline: 숫자로 읽는 비룡 키우기
description: "비룡 키우기 : 무협 RPG — 배포본에서 추출한 데이터 위키"
lang: ko
timezone: Asia/Seoul

url: https://gopass2002.github.io
baseurl: ""
repository: gopass2002/afk-wiki

# GitHub Actions가 배포 시 실제 프로젝트 경로를 --baseurl로 주입합니다.
# 데이터 출처와 버전은 _data/generated_manifest.json을 단일 기준으로 사용합니다.

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  toc_levels: 2..3
permalink: pretty
sass:
  style: compressed

defaults:
  - scope: { path: "docs" }
    values: { layout: "data" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - preview
